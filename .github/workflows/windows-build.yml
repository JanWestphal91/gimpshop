# Builds GIMPshop for Windows (x64, MSYS2/CLANG64) and uploads a portable
# bundle as a workflow artifact. Reuses GIMP's own build/windows scripts.
#
# Download: Actions tab -> "Windows build" run -> artifact "gimpshop-windows-x64".
# Unzip and start bin\gimp-3.3.exe (or gimp.cmd).

name: Windows build

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      CC: cc
      CXX: c++
      MSYSTEM_PREFIX: clang64
    steps:
      - name: Checkout (with gimp-data submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git

      - name: Build dependencies (babl, GEGL, ...)
        shell: powershell
        run: |
          $env:MSYS_ROOT = '${{ steps.msys2.outputs.msys2-location }}'
          $GITLAB_CI = 'true'
          $GIT_DEPTH = '1'
          $GIMP_PREFIX = "$PWD\_install"
          $PKGCONF_RELOCATABLE_OPTION = '-Dpkgconfig.relocatable=true'
          build\windows\1_build-deps-msys2.ps1

      - name: Build and bundle GIMPshop
        shell: powershell
        run: |
          $env:MSYS_ROOT = '${{ steps.msys2.outputs.msys2-location }}'
          $GITLAB_CI = 'true'
          $GIMP_PREFIX = "$PWD\_install"
          $PKGCONF_RELOCATABLE_OPTION = '-Dpkgconfig.relocatable=true'
          $INSTALLER_OPTION = '-Dwindows-installer=true'
          # Step 1 already downloaded and extracted winflexbison. Put it on
          # PATH so the script finds win_flex and does not try to extract
          # the archive a second time (Expand-Archive fails on existing files).
          if (Test-Path "$PWD\winflexbison") { $env:PATH = "$PWD\winflexbison;$env:PATH" }
          build\windows\2_build-gimp-msys2.ps1

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: gimpshop-windows-x64
          path: gimp-clang64/
          if-no-files-found: error
          retention-days: 14

      - name: Diagnose bundling failure
        if: failure()
        shell: powershell
        run: |
          $env:MSYS_ROOT = '${{ steps.msys2.outputs.msys2-location }}'
          $env:PATH = "$env:MSYS_ROOT\clang64\bin;$env:MSYS_ROOT\usr\bin;$env:PATH"
          $b = Get-ChildItem -Directory _build-* | Select-Object -First 1
          if (-not $b) { Write-Output "no build dir"; exit 0 }
          Write-Output "== Main binary line in meson-log =="
          Select-String -Path "$($b.FullName)\meson-logs\meson-log.txt" -Pattern 'Main binary' | Select-Object -First 3
          Write-Output "== Running bundle script directly =="
          Set-Location $b.FullName
          $env:MESON_BUILD_ROOT = $b.FullName
          $env:MESON_SOURCE_ROOT = (Resolve-Path ..).Path
          $env:MESON_INSTALL_DESTDIR_PREFIX = (Resolve-Path ..\_install).Path
          python ..\build\windows\2_bundle-gimp-uni_base.py 2>&1 | Select-Object -Last 60

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            _build-*/meson-logs/meson-log.txt
            babl/_build-*/meson-logs/meson-log.txt
            gegl/_build-*/meson-logs/meson-log.txt
