<?xml version="1.0" encoding="UTF-8"?>
<!-- GIMPshop splash screen. Original artwork, CC BY-SA 4.0.
     Rendered to gimpshop-splash.png with:
       rsvg-convert -w 1000 -h 560 gimpshop-splash.svg -o gimpshop-splash.png -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d33"/>
      <stop offset="1" stop-color="#18191d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f2683c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2683c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="560" fill="url(#bg)"/>
  <rect width="1000" height="560" fill="url(#glow)"/>
  <!-- faint layer outlines in the background -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" transform="rotate(-12 780 300)">
    <rect x="640" y="90" width="300" height="300" rx="50"/>
    <rect x="610" y="140" width="300" height="300" rx="50"/>
    <rect x="580" y="190" width="300" height="300" rx="50"/>
  </g>
  <image x="90" y="140" width="230" height="230" xlink:href="gimpshop-logo.svg"/>
  <text x="350" y="265" font-family="Inter, DejaVu Sans, sans-serif" font-size="96"
        font-weight="700" fill="#f4f4f4" letter-spacing="-2">GIMP<tspan fill="#ffb347">shop</tspan></text>
  <text x="354" y="315" font-family="Inter, DejaVu Sans, sans-serif" font-size="24"
        font-weight="400" fill="#a9abb3">Familiar workflow. Free software.</text>
  <text x="354" y="350" font-family="Inter, DejaVu Sans, sans-serif" font-size="17"
        font-weight="400" fill="#6f727b">Based on GIMP, the GNU Image Manipulation Program</text>
</svg>
